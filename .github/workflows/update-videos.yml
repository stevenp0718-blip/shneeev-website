name: Update YouTube Videos

on:
  workflow_dispatch:

  schedule:
    # GitHub schedules can be delayed during busy periods. Checking every five
    # minutes gives the updater more chances to run soon after an upload.
    - cron: "*/5 * * * *"

concurrency:
  group: update-youtube-videos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate videos.json with retries
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node scripts/updateVideos.js; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "YouTube update failed after 3 attempts."
              exit 1
            fi

            echo "YouTube API attempt $attempt failed; retrying in 20 seconds..."
            sleep 20
          done

      - name: Announce new full-length videos in Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/sendDiscordNotification.js

      - name: Notify subscribers about new reviews
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
        run: node scripts/sendReviewNotification.js

      - name: Commit updated videos and generated content pages
        run: |
          # Attribute generated commits to the repository owner so the
          # Cloudflare Git integration treats them as production deploys.
          git config user.name "stevenp0718-blip"
          git config user.email "310882355+stevenp0718-blip@users.noreply.github.com"

          git add videos.json reviews.json reviews lists notified-videos.json discord-notified-videos.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto update latest videos"
            git pull --rebase origin main
            git push origin main
          fi
